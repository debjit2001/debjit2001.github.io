  </ul>
</nav>

<div class="page">

  <div class="page-banner">
    <h1>Contact</h1>
  </div>

  <section class="content-section">
    <div class="container">

      <div class="contact-grid">

        <a href="mailto:debjit80659@gmail.com" class="contact-item" id="contact-email-personal">
          <div class="contact-icon">✉️</div>
          <div>
            <div class="contact-label">Personal Email</div>
            <div class="contact-value">debjit80659@gmail.com</div>
          </div>
        </a>

        <a href="mailto:debjit.chatterjee.24@kgpian.iitkgp.ac.in" class="contact-item" id="contact-email-institute">
          <div class="contact-icon">🎓</div>
          <div>
            <div class="contact-label">Institute Email</div>
            <div class="contact-value">debjit.chatterjee.24@kgpian.iitkgp.ac.in</div>
          </div>
        </a>

        <a href="https://www.linkedin.com/in/debjit-chatterjee-5683bb1a3/" target="_blank" class="contact-item" id="contact-linkedin">
          <div class="contact-icon">🔗</div>
          <div>
            <div class="contact-label">LinkedIn</div>
            <div class="contact-value">linkedin.com/in/debjit-chatterjee</div>
          </div>
        </a>
      </div>

      <hr class="green-divider-thin" style="margin:2rem 0;"/>

      <div class="contact-form-section">
        <h2>Send a Message</h2>
        <form class="contact-form" id="contact-form" action="mailto:debjit80659@gmail.com" method="post" enctype="text/plain">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required/>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required/>
          </div>
          <div class="form-group full-width">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Research collaboration, inquiry, etc."/>
          </div>
          <div class="form-group full-width">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
          </div>
          <div class="form-group full-width">
            <button type="submit" class="btn btn-primary">Send Message</button>
          </div>
        </form>
      </div>

    </div>
  </section>

</div>

<script src="js/main.js"></script>
</body>
